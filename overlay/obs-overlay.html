<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Foundry Stream Overlay</title>
<style>
:root{--bg:rgba(20,20,22,.88);--fg:#f4f1ea;--edge:#b99655}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;color:var(--fg);font-family:Georgia,"Times New Roman",serif}
body{box-sizing:border-box;position:relative;padding:0}
#root{position:absolute;inset:0;width:100%;height:100%}
.card{position:absolute;box-sizing:border-box;width:23%;max-width:360px;height:150px;min-width:0;overflow:hidden;display:grid;grid-template-columns:96px minmax(0,1fr);gap:11px;align-items:center;padding:11px;border:1px solid rgba(255,255,255,.22);background:var(--bg);box-shadow:0 8px 22px rgba(0,0,0,.3)}
.portrait{width:92px;height:92px;object-fit:cover;border:2px solid var(--edge);box-sizing:border-box}
.circle .portrait{border-radius:50%}.square .portrait{border-radius:4px}
.meta{min-width:0;overflow:hidden}.name{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.role{font-size:12px;opacity:.72;margin-top:3px}
.stats{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:5px 9px;margin-top:7px;font-size:12px;white-space:nowrap}.stats span{overflow:hidden;text-overflow:ellipsis}.stats b{font-size:10px;opacity:.7}
.hpbar{height:7px;margin-top:5px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}.hpfill{height:100%;background:#58ad62}
.death{margin-top:6px;display:grid;grid-template-columns:auto auto;gap:2px 8px;font-size:9px;overflow:hidden}.death-title{grid-column:1/-1;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.save{display:flex;align-items:center;gap:4px;white-space:nowrap}.pips{display:flex;gap:3px}.pip{box-sizing:border-box;width:7px;height:7px;border:1px solid currentColor;border-radius:50%}.pip.ok.on{background:#62c66e}.pip.bad.on{background:#c75a5a}
.wait{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:9px 14px;background:rgba(10,10,12,.85);border:1px solid rgba(255,255,255,.2);font:13px Arial,sans-serif}
.theme-light{--bg:rgba(230,230,230,.92);--fg:#161616}.theme-nature{--bg:rgba(27,43,31,.9)}.theme-bronze{--bg:rgba(56,40,27,.92)}
@media(max-width:1100px){.card{height:130px;grid-template-columns:72px minmax(0,1fr);padding:8px;gap:7px}.portrait{width:68px;height:68px}.name{font-size:14px}.stats{font-size:9px;gap:3px 5px}}

#stream-frame{position:fixed;inset:0;box-sizing:border-box;pointer-events:none;z-index:1;border:10px solid #171b20;box-shadow:inset 0 0 0 2px #8b744b,inset 0 0 0 5px #252b31}
#stream-frame:before,#stream-frame:after{content:"";position:absolute;left:74px;right:74px;height:5px;background:var(--frame-fill,#20262d);border-top:1px solid var(--frame-trim,#8b744b);border-bottom:1px solid var(--frame-trim,#8b744b)}
#stream-frame:before{top:-7px}#stream-frame:after{bottom:-7px}
.corner{position:absolute;width:46px;height:46px;display:grid;place-items:center;box-sizing:border-box;background:var(--frame-fill,#20262d);border:2px solid var(--frame-trim,#8b744b);color:var(--frame-trim,#8b744b);font:26px Georgia,serif;font-style:normal}.tl{left:-7px;top:-7px}.tr{right:-7px;top:-7px}.bl{left:-7px;bottom:-7px}.br{right:-7px;bottom:-7px}
.theme-dark{--frame-fill:#20262d;--frame-trim:#8b744b}.theme-light{--frame-fill:#6f685d;--frame-trim:#b69a68;--bg:rgba(76,72,66,.92);--fg:#f1eadc}.theme-nature{--frame-fill:#26372c;--frame-trim:#9a8653}.theme-bronze{--frame-fill:#49372b;--frame-trim:#b58a55}
body:has(#root.theme-dark) #stream-frame{--frame-fill:#20262d;--frame-trim:#8b744b}body:has(#root.theme-light) #stream-frame{--frame-fill:#6f685d;--frame-trim:#b69a68}body:has(#root.theme-nature) #stream-frame{--frame-fill:#26372c;--frame-trim:#9a8653}body:has(#root.theme-bronze) #stream-frame{--frame-fill:#49372b;--frame-trim:#b58a55}
#root{z-index:2}
</style></head><body><div id="stream-frame" aria-hidden="true"><i class="corner tl">◇</i><i class="corner tr">◇</i><i class="corner bl">◇</i><i class="corner br">◇</i></div><main id="root"><div class="wait">Waiting for Foundry…</div></main><script src="overlay.js"></script></body></html>
