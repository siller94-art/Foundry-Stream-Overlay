<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Foundry Stream Overlay</title>
<style>
:root{--bg:rgba(20,20,22,.88);--fg:#f4f1ea;--edge:#b99655}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;color:var(--fg);font-family:Georgia,"Times New Roman",serif}
body{box-sizing:border-box;display:flex;align-items:flex-end;justify-content:center;padding:24px}
#root{width:100%;max-width:1500px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
.card{box-sizing:border-box;width:100%;height:150px;min-width:0;overflow:hidden;display:grid;grid-template-columns:96px minmax(0,1fr);gap:11px;align-items:center;padding:11px;border:1px solid rgba(255,255,255,.22);background:var(--bg);box-shadow:0 8px 22px rgba(0,0,0,.3)}
.portrait{width:92px;height:92px;object-fit:cover;border:2px solid var(--edge);box-sizing:border-box}
.circle .portrait{border-radius:50%}.square .portrait{border-radius:4px}
.meta{min-width:0;overflow:hidden}.name{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.role{font-size:12px;opacity:.72;margin-top:3px}
.stats{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:5px 9px;margin-top:7px;font-size:12px;white-space:nowrap}.stats span{overflow:hidden;text-overflow:ellipsis}.stats b{font-size:10px;opacity:.7}
.hpbar{height:7px;margin-top:5px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}.hpfill{height:100%;background:#58ad62}
.death{margin-top:6px;display:grid;grid-template-columns:auto auto;gap:2px 8px;font-size:9px;overflow:hidden}.death-title{grid-column:1/-1;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.save{display:flex;align-items:center;gap:4px;white-space:nowrap}.pips{display:flex;gap:3px}.pip{box-sizing:border-box;width:7px;height:7px;border:1px solid currentColor;border-radius:50%}.pip.ok.on{background:#62c66e}.pip.bad.on{background:#c75a5a}
.wait{grid-column:1/-1;justify-self:center;padding:9px 14px;background:rgba(10,10,12,.85);border:1px solid rgba(255,255,255,.2);font:13px Arial,sans-serif}
.theme-light{--bg:rgba(230,230,230,.92);--fg:#161616}.theme-nature{--bg:rgba(27,43,31,.9)}.theme-bronze{--bg:rgba(56,40,27,.92)}
@media(max-width:1100px){body{padding:12px}#root{gap:7px}.card{height:130px;grid-template-columns:72px minmax(0,1fr);padding:8px;gap:7px}.portrait{width:68px;height:68px}.name{font-size:14px}.stats{font-size:9px;gap:3px 5px}}
</style></head><body><main id="root"><div class="wait">Waiting for Foundry…</div></main><script src="overlay.js"></script></body></html>
