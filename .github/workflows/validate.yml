name: Validate Foundry Stream Overlay
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest and feature contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('module.json','utf8'));
          const js=fs.readFileSync('scripts/main.js','utf8');
          const html=fs.readFileSync('overlay/obs-overlay.html','utf8');
          const renderer=fs.readFileSync('overlay/overlay.js','utf8');
          const required=[
            ['version',m.version==='0.9.5'],
            ['Foundry 14.368',m.compatibility?.verified==='14.368'],
            ['editor',js.includes('Edit Overlay Layout')&&js.includes('openLayoutEditor')],
            ['Notes tool',js.includes('getSceneControlButtons')&&js.includes('notes.tools.foundryStreamOverlay')],
            ['no floating launcher',!js.includes('fso-left-overlay-button')],
            ['OBS test',js.includes('Reconnect / Test OBS')&&js.includes('CallVendorRequest')],
            ['GM + 3 players',js.includes('slice(0,3)')],
            ['death saves',js.includes('Show Death Saving Throws')],
            ['portrait shape',js.includes('Portrait Shape')],
            ['four themes',['dark','light','nature','bronze'].every(t=>js.includes(t)&&html.includes('theme-'+t))],
            ['renderer event',renderer.includes('foundryStreamOverlayState')]
          ];
          for(const [name,ok] of required){console.log(ok?'PASS':'FAIL',name);if(!ok)process.exitCode=1}
          for(const p of ['overlay/frames/dark.svg','overlay/frames/muted-light.svg','overlay/frames/nature.svg','overlay/frames/bronze.svg']){if(!fs.existsSync(p)){console.log('FAIL',p);process.exitCode=1}else console.log('PASS',p)}
          NODE
      - name: JavaScript syntax
        run: |
          node --check scripts/main.js
          node --check overlay/overlay.js
      - name: Build Foundry-ready ZIP
        run: zip -r foundry-stream-overlay.zip module.json scripts styles overlay templates 2>/dev/null || zip -r foundry-stream-overlay.zip module.json scripts styles overlay
      - uses: actions/upload-artifact@v4
        with:
          name: foundry-stream-overlay
          path: foundry-stream-overlay.zip
